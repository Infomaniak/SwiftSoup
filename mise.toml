# Optional contributor shortcuts; use the Swift toolchain already on PATH.
[tasks."test:release"]
description = "Run release tests without the opt-in performance benchmark"
env.SWIFTSOUP_BENCHMARK = "0"
run = "swift test -c release"

[tasks.bench]
description = "Run the existing release benchmark with a modest default workload"
run = '''
SWIFTSOUP_BENCHMARK=1 \
SWIFTSOUP_BENCHMARK_SET="${SWIFTSOUP_BENCHMARK_SET:-base,large}" \
SWIFTSOUP_BENCHMARK_REPEAT="${SWIFTSOUP_BENCHMARK_REPEAT:-200}" \
SWIFTSOUP_BENCHMARK_LARGE_REPEAT="${SWIFTSOUP_BENCHMARK_LARGE_REPEAT:-60}" \
SWIFTSOUP_BENCHMARK_WARMUP="${SWIFTSOUP_BENCHMARK_WARMUP:-2}" \
SWIFTSOUP_BENCHMARK_ITERATIONS="${SWIFTSOUP_BENCHMARK_ITERATIONS:-10}" \
SWIFTSOUP_BENCHMARK_ITERATIONS_MULTIPLIER="${SWIFTSOUP_BENCHMARK_ITERATIONS_MULTIPLIER:-1}" \
SWIFTSOUP_BENCHMARK_SELECTOR_REPEAT="${SWIFTSOUP_BENCHMARK_SELECTOR_REPEAT:-1}" \
SWIFTSOUP_BENCHMARK_SELECTOR_STRESS_REPEAT="${SWIFTSOUP_BENCHMARK_SELECTOR_STRESS_REPEAT:-1}" \
SWIFTSOUP_BENCHMARK_ATTRIBUTE_SELECTOR_STRESS_REPEAT="${SWIFTSOUP_BENCHMARK_ATTRIBUTE_SELECTOR_STRESS_REPEAT:-1}" \
swift test -c release --filter BenchmarkProfileTest/testParseBenchmarkProfile
'''
